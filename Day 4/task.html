<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Box Layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* Main container: stacks the 3 rows vertically */
    .container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      max-width: 620px;
    }

    /* Middle row: boxes 2-7 side by side */
    .row {
      display: flex;
      gap: 2px;
    }

    .box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100px;
      font-size: 12px;
      color: #000;
    }

    .box1 { 
        background: #dc3a5f; 
    }
    .box8 { 
        background: #7a7af0; 
    }

    .row .box { 
        flex: 1; 
    }

    .box2 { 
        background: #c9a97a; 
    }
    .box3 { 
        background: #f4c842; 
    }
    .box4 { 
        background: #ea8aa0; 
    }
    .box5 { 
        background: #76b947; 
    }
    .box6 { 
        background: #e8587c; 
    }
    .box7 { 
        background: #555874; 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box box1">BOX 1</div>

    <div class="row">
      <div class="box box2">BOX 2</div>
      <div class="box box3">BOX 3</div>
      <div class="box box4">BOX 4</div>
      <div class="box box5">BOX 5</div>
      <div class="box box6">BOX 6</div>
      <div class="box box7">BOX 7</div>
    </div>

    <div class="box box8">BOX 8</div>
  </div>
</body>
</html>
