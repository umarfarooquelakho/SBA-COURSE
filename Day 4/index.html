<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-wrap: no-wrap;
            width: 100%;
            background: lightgray;
        }

        .box {
            background: skyblue;
            padding: 15px;
            margin: 5px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box item-1">One</div>
        <div class="box item-2">Two</div>
        <div class="box item-3">Three</div>
        <div class="box item-4">Four</div>
        <div class="box item-5">Five</div>
        <div class="box item-6">Six</div>
    </div>
</body>
</html>
