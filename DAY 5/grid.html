<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-GRID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        .grid-container {
            display: grid;
            width: 100%;
            border: 3px solid blue;
            height: 600px;
            
           
            grid-template-columns: repeat(3, 100px);
            /* grid-template-rows: repeat(3, minmax(200px, auto)); */
            grid-template-rows: repeat(3, 80px);
            /* row-gap: 10px;
            column-gap: 10px;  */
            

            /* justify-items: center;
            align-items: center; */
            /* place-items: center; */

            /* justify-content: center;
            align-content: center; */

            /* justify-items: center;
            align-items: center; */
        }

        .grid-items {
            border: 4px solid black;
            text-align: center;
            padding: 20px;
        }

        .item-1 {
            height: 20px;
            width: 20px;
            align-self: center;
            justify-self: center;
        }

    </style>
</head>
<body>
    <h1>CSS-GRID Parent Properties</h1>

    <div class="grid-container">
        <div id="item-1" class="grid-items">1</div>
        <div id="item-2" class="grid-items">2</div>
        <div id="item-3" class="grid-items">3</div>
        <div id="item-4" class="grid-items">4</div>
        <div id="item-5" class="grid-items">5</div>
        <div id="item-6" class="grid-items">6</div>
        <div id="item-7" class="grid-items">7</div>
        <div id="item-8" class="grid-items">8</div>
        <div id="item-9" class="grid-items">9</div>
    </div>
</body>
</html>
